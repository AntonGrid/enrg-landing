# Local dev example: ENRG Oracle via docker compose
#
# IMPORTANT:
#   * Do NOT commit .env.local to git! Add it to .gitignore (see below).
#   * FOUNDER_KEY is passed ONLY via .env.local (or environment variables).
#
# Example .env.local (create manually next to this file):
#   PORT=3000
#   FOUNDER_KEY=[1,2,3,...,64]   # <- Do NOT paste a real key!
#
# .gitignore (add at the project root):
#   .env.local

services:
  oracle:
    build:
      # Context = oracle repository root (package.json + server.js)
      context: ../../ENRG
      # Example Dockerfile — in docs/docker-oracle.md
      dockerfile: Dockerfile
    container_name: enrg-oracle
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      PORT: 3000
    volumes:
      # Mount sources for hot-reload during development
      - ../../ENRG:/app
      # Keep node_modules from the image (do not overwrite with the host dir)
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/stats"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
