<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ENRG Protocol</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/favicon.ico" />
</head>
<body class="page--dashboard">

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="/" class="navbar__logo">
      <img src="assets/logo.svg" alt="ENRG" width="32" height="32" />
      <span>ENRG</span>
    </a>
    <div class="navbar__right">
      <span id="user-address" class="navbar__address"></span>
      <button id="logout-btn" class="btn btn--ghost btn--sm">Disconnect</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="dashboard" id="register-root">

    <!-- Summary bar -->
    <section class="dashboard__summary">
      <div class="container summary-grid">
        <div class="summary-card">
          <span class="summary-card__label">Total Minted</span>
          <span class="summary-card__value" id="summary-minted">—</span>
        </div>
        <div class="summary-card">
          <span class="summary-card__label">Active Devices</span>
          <span class="summary-card__value" id="summary-devices">—</span>
        </div>
        <div class="summary-card">
          <span class="summary-card__label">Pending Energy</span>
          <span class="summary-card__value" id="summary-pending">—</span>
        </div>
      </div>
    </section>

    <!-- Devices -->
    <section class="dashboard__section">
      <div class="container">
        <div class="section-header">
          <h2>My Devices</h2>
          <a href="/register.html" class="btn btn--primary btn--sm">+ Add Device</a>
        </div>
        <div id="devices-list" class="devices-grid">
          <!-- Populated by dashboard.js -->
        </div>
      </div>
    </section>

    <!-- Mint History -->
    <section class="dashboard__section">
      <div class="container">
        <h2>Mint History</h2>
        <div id="mint-history" class="history-wrapper">
          <!-- Populated by dashboard.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__brand">ENRG Protocol © 2026</span>
    </div>
  </footer>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
