<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ENRG Protocol | SRC Token</title>
  <meta name="description" content="ENRG Dashboard: device status, SRC balance, and mining activity." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" />
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js" defer></script>
</head>
<body>

  <header class="navbar">
    <a href="/" class="navbar__logo">
      <img src="assets/logo.svg" alt="ENRG" width="32" height="32" />
      <span>ENRG</span>
    </a>
    <nav class="navbar__links">
      <a href="/whitepaper.html">Whitepaper</a>
      <a href="/technical-overview.html">Docs</a>
      <a href="/dashboard.html" class="active">Dashboard</a>
    </nav>
    <button id="wallet-btn" class="btn btn--outline">Connect Wallet</button>
    <span id="wallet-address" class="wallet-address"></span>
    <button id="logout-btn" class="btn btn--ghost" style="margin-left:0.5rem;">Logout</button>
  </header>

  <main>
    <section class="section">
      <div class="section__inner">
        <h1 class="section__title">Device Dashboard</h1>
        <p class="section__lead">
          Monitor your device status, SRC balance, and mining activity.
          Wallet: <span id="user-address" class="highlight">—</span>
        </p>

        <div class="grid grid--2">
          <div class="card">
            <h2>📟 Device Info</h2>
            <p>Device ID: <strong id="device-id-display">—</strong></p>
            <div id="device-info"></div>
          </div>
          <div class="card">
            <h2>💰 SRC Balance</h2>
            <p id="src-balance" class="balance-large">—</p>
            <p class="text-muted">1 SRC = 1 MWh verified energy</p>
          </div>
        </div>

        <div id="dashboard-root"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__links">
        <a href="/whitepaper.html">Whitepaper</a>
        <a href="/technical-overview.html">Technical Docs</a>
        <a href="https://github.com/AntonGrid/enrg" target="_blank">GitHub</a>
        <a href="https://t.me/enrg_network" target="_blank">Telegram</a>
        <a href="mailto:anton@enrg.network">Contact</a>
      </div>
      <p class="footer__copy">© 2026 ENRG Protocol. Built on Solana.</p>
    </div>
  </footer>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
