<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Device — ENRG Protocol</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/favicon.ico" />
</head>
<body class="page--register">

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="/" class="navbar__logo">
      <img src="assets/logo.svg" alt="ENRG" width="32" height="32" />
      <span>ENRG</span>
    </a>
    <button id="wallet-btn" class="btn btn--outline">Connect Wallet</button>
  </header>

  <!-- MAIN -->
  <main class="register-page" id="register-root">

    <!-- Step 1: Create Profile -->
    <div id="step-profile" class="register-step active">
      <div class="register-card">
        <h1>Create Profile</h1>
        <p class="register-card__sub">One-time setup before registering your device.</p>
        <form id="profile-form" class="form" novalidate>
          <div class="form__group">
            <label for="profile-name">Full Name *</label>
            <input id="profile-name" type="text" placeholder="John Doe" required />
          </div>
          <div class="form__group">
            <label for="profile-email">Email (optional)</label>
            <input id="profile-email" type="email" placeholder="john@example.com" />
          </div>
          <div class="form__group">
            <label for="profile-country">Country *</label>
            <input id="profile-country" type="text" placeholder="United States" required />
          </div>
          <button type="submit" class="btn btn--primary btn--full">
            Create Profile
          </button>
        </form>
      </div>
    </div>

    <!-- Step 2: Register Device -->
    <div id="step-device" class="register-step">
      <div class="register-card">
        <h1>Register Device</h1>
        <p class="register-card__sub">Add your energy-producing device to the protocol.</p>
        <form id="device-form" class="form" novalidate>
          <div class="form__group">
            <label for="device-name">Device Name *</label>
            <input id="device-name" type="text" placeholder="Rooftop Solar Panel A" required />
          </div>
          <div class="form__group">
            <label for="device-type">Device Type *</label>
            <select id="device-type" required>
              <option value="">Select type...</option>
              <option value="solar">Solar Panel</option>
              <option value="wind">Wind Turbine</option>
              <option value="hydro">Hydro Generator</option>
              <option value="battery">Battery Storage</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form__group">
            <label for="device-capacity">Capacity (kWh) *</label>
            <input id="device-capacity" type="number" min="0.1" step="0.1"
                   placeholder="5.5" required />
          </div>
          <div class="form__group">
            <label for="device-location">Location *</label>
            <input id="device-location" type="text"
                   placeholder="City, Country" required />
          </div>
          <button type="submit" class="btn btn--primary btn--full">
            Register Device
          </button>
        </form>
      </div>
    </div>

  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
