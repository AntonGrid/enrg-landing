<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация устройства — ENRG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Регистрация устройства ENRG для отслеживания накопленной энергии и участия в DePIN.">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
<nav class="navbar">
    <a href="index.html" data-page-link="home">🏠 Главная</a>
    <a href="register.html" data-page-link="register">📝 Регистрация</a>
    <a href="dashboard.html" data-page-link="dashboard" data-auth="only">📊 Дашборд</a>
    <a href="#" id="logoutLink" data-auth="only">🚪 Выйти</a>
</nav>

<main>
    <section class="glass-section">
        <h2>Регистрация устройства ⚡</h2>
        <p>Введи <strong>device_id</strong> и <strong>public_key</strong>, чтобы привязать устройство к ENRG.</p>

        <div id="alreadyRegistered" style="display:none; margin-bottom:1rem;">
            <p>Устройство уже зарегистрировано в этом браузере.</p>
            <a class="btn-primary" href="dashboard.html">Перейти в дашборд →</a>
        </div>

        <form id="regForm" novalidate>
            <label for="device_id">Device ID</label>
            <input type="text" id="device_id" name="device_id" required placeholder="например, device-123">

            <label for="public_key">Public Key (base64, 44 символа)</label>
            <input type="text" id="public_key" name="public_key" required minlength="44" maxlength="44" placeholder="Base64-ключ">

            <button class="btn-primary" type="submit">Зарегистрировать</button>
        </form>

        <p id="errorMsg" style="color:#ff6b6b; margin-top:0.75rem;"></p>
        <p id="successMsg" style="color:#4caf50; margin-top:0.75rem;"></p>
    </section>
</main>

<script>
const ENRG_API_BASE = "https://enrg-oracle.onrender.com/api/v1/device";

function getStoredDevice() {
    return {
        id: localStorage.getItem("enrgDeviceId"),
        pubKey: localStorage.getItem("enrgPublicKey"),
    };
}

function setStoredDevice(id, pubKey) {
    localStorage.setItem("enrgDeviceId", id);
    localStorage.setItem("enrgPublicKey", pubKey);
}

function clearStoredDevice() {
    localStorage.removeItem("enrgDeviceId");
    localStorage.removeItem("enrgPublicKey");
}

function initNav() {
    const { id, pubKey } = getStoredDevice();
    const isAuth = Boolean(id && pubKey);

    const links = document.querySelectorAll("nav a[data-page-link]");
    const currentPage = document.body.dataset.page;
    links.forEach(link => {
        if (link.dataset.pageLink === currentPage) {
            link.classList.add("active");
        } else {
            link.classList.remove("active");
        }
    });

    document.querySelectorAll("[data-auth='only']").forEach(el => {
        el.style.display = isAuth ? "inline-block" : "none";
    });

    const registerLink = document.querySelector("a[data-page-link='register']");
    if (registerLink) {
        registerLink.style.display = isAuth ? "none" : "inline-block";
    }

    const logoutLink = document.getElementById("logoutLink");
    if (logoutLink) {
        logoutLink.addEventListener("click", (e) => {
            e.preventDefault();
            clearStoredDevice();
            window.location.href = "index.html";
        });
    }
}

function initRegisterPage() {
    const { id, pubKey } = getStoredDevice();
    const alreadyBlock = document.getElementById("alreadyRegistered");
    const form = document.getElementById("regForm");

    if (id && pubKey) {
        if (alreadyBlock) alreadyBlock.style.display = "block";
        if (form) form.style.display = "none";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    initNav();
    initRegisterPage();

    const form = document.getElementById("regForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");

    if (!form) return;

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.textContent = "";
        successMsg.textContent = "";

        const device_id = document.getElementById("device_id").value.trim();
        const public_key = document.getElementById("public_key").value.trim();

        if (!device_id || !public_key) {
            errorMsg.textContent = "Заполни все поля.";
            return;
        }
        if (public_key.length !== 44) {
            errorMsg.textContent = "Public key должен быть длиной 44 символа.";
            return;
        }

        try {
            const res = await fetch(ENRG_API_BASE + "/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ device_id, public_key })
            });

            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                errorMsg.textContent = data.error || "Ошибка регистрации (возможно, устройство уже зарегистрировано).";
                return;
            }

            setStoredDevice(device_id, public_key);
            successMsg.textContent = "Устройство успешно зарегистрировано. Перенаправляем в дашборд…";
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 800);

        } catch (err) {
            console.error(err);
            errorMsg.textContent = "Ошибка соединения с оракулом. Попробуй позже.";
        }
    });
});
</script>
</body>
</html>
