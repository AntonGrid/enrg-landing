<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Device — ENRG Protocol | SRC Token</title>
  <meta name="description" content="Register your energy device with ENRG to start tokenizing production as SRC tokens." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>

  <header class="navbar">
    <a href="/" class="navbar__logo">
      <img src="assets/logo.svg" alt="ENRG" width="32" height="32" />
      <span>ENRG</span>
    </a>
    <nav class="navbar__links">
      <a href="/whitepaper.html">Whitepaper</a>
      <a href="/technical-overview.html">Docs</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
    <button id="wallet-btn" class="btn btn--outline">Connect Wallet</button>
    <span id="wallet-address" class="wallet-address"></span>
  </header>

  <main>
    <section class="section">
      <div class="section__inner">
        <h1 class="section__title">Register Your Device</h1>
        <p class="section__lead">
          Connect your Phantom wallet and register your energy device to start earning
          <strong>SRC (Source)</strong> tokens for every verified MWh.
        </p>

        <form id="device-form" class="form">
          <div class="form__group">
            <label for="device-id">Device ID</label>
            <input type="text" id="device-id" name="device_id" required
                   placeholder="e.g., device-001" class="form__input" />
          </div>
          <div class="form__group">
            <label for="device-public-key">Public Key (base64, 44 characters)</label>
            <input type="text" id="device-public-key" name="public_key" required
                   minlength="44" maxlength="44"
                   placeholder="Base64-encoded Ed25519 public key" class="form__input" />
          </div>
          <button type="submit" class="btn btn--primary">Register Device</button>
        </form>

        <div id="register-root"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__links">
        <a href="/whitepaper.html">Whitepaper</a>
        <a href="/technical-overview.html">Technical Docs</a>
        <a href="https://github.com/AntonGrid/enrg" target="_blank">GitHub</a>
        <a href="https://t.me/enrg_network" target="_blank">Telegram</a>
        <a href="mailto:anton@enrg.network">Contact</a>
      </div>
      <p class="footer__copy">© 2026 ENRG Protocol. Built on Solana.</p>
    </div>
  </footer>

  <script type="module" src="js/register.js"></script>
</body>
</html>
